<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sacbé — trip planner</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
    <!-- Node-global shim: CopilotKit's browser bundles (and some of their
         transitive deps) read `process`/`process.env`, which the Angular CLI
         builder used to polyfill but Vite does not. Must run before main.ts. -->
    <script>
      window.process = window.process || {
        env: {},
        argv: [],
        platform: "browser",
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
